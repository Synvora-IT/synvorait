{% extends 'base.html' %}

{% block title %}
Post a blog
{% endblock title %}

{% block content %}
<div class="form-wrapper">
    <div class="form-container" style="max-width:850px;">
            <div class="form-header">
                <h2>Post a blog</h2>
            </div>

            <form action="{% url 'create-blog' %}" method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="input-group">
                        {{field.label_tag}}
                        {{field}}
                    </div>
                {% endfor %}

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Post</button>
            </form>
        </div>
    </div>
{% endblock content %}
