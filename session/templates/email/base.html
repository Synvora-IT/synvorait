{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Synvora{% endblock %}</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
">

    <!-- Main Container -->
    <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="background-color: #f4f6f8; padding: 40px 15px;"
    >
        <tr>
            <td align="center">

                <!-- Email Card -->
                <table
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="
                        max-width: 600px;
                        background-color: #ffffff;
                        border-radius: 8px;
                        overflow: hidden;
                    "
                >

                    <!-- Logo -->
                    <tr>
                        <td
                            align="center"
                            style="padding: 30px 20px 20px;"
                        >
                            <a href="synvorait.com" style="text-decoration: none;">
                                <img
                                    src="{% static 'images/logo-bg-remove-footer.png' %}"
                                    alt="Synvora IT"
                                    style="
                                        max-width: 160px;
                                        height: auto;
                                        display: block;
                                    "
                                >
                            </a>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td
                            style="
                                padding: 20px 40px 40px;
                                color: #333333;
                                font-size: 15px;
                                line-height: 1.6;
                            "
                        >
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            align="center"
                            style="
                                padding: 20px;
                                background-color: #f8f9fa;
                                color: #777777;
                                font-size: 13px;
                            "
                        >
                            <p style="margin: 0;">
                                &copy; {% now "Y" %} Synvora IT. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
